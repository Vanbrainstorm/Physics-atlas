:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#ecf2ff}*{box-sizing:border-box}body{margin:0}a{color:#9dbaff}header{position:sticky;top:0;z-index:3;background:#101a30ee;backdrop-filter:blur(12px);border-bottom:1px solid #2e405c;padding:15px clamp(18px,4vw,65px);display:flex;justify-content:space-between;gap:15px;align-items:center}header a{text-decoration:none;font-weight:750}.wrap{max-width:1160px;margin:auto;padding:30px 20px;display:grid;grid-template-columns:270px 1fr;gap:28px}aside{position:sticky;top:85px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}button,select{font:inherit;cursor:pointer}button{background:#1a2a45;border:1px solid #3a5173;color:#eaf0ff;padding:10px 13px;border-radius:10px}button:hover{border-color:#88a9ff}button.active,.primary{background:#648bff;color:#0c1730;font-weight:700}aside button{display:block;width:100%;text-align:left;margin:7px 0}.muted{color:#a1b2ca}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.7px;color:#93b0ff}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-1px;margin:10px 0}h2{margin-top:35px}p,li{line-height:1.8;color:#bfcbdd}.panel{border:1px solid #304360;border-radius:17px;background:#141f34;padding:24px;margin:20px 0}.math{padding:15px;overflow-x:auto;background:#0a1528;border-radius:10px;margin:16px 0}.step{border-left:3px solid #6d91e9;padding-left:20px;margin:20px 0}.step h3{margin-bottom:7px}.step p{margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.pill{display:inline-block;background:#243653;color:#c4d6f9;border-radius:50px;padding:6px 12px;font-size:12px}.options button{display:block;width:100%;text-align:left;margin:8px 0}.feedback{margin-top:14px;border-radius:10px;padding:14px;background:#20314b}.good{border:1px solid #37bc9e}.bad{border:1px solid #d68a72}.hidden{display:none}.progress{height:8px;background:#293851;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#7a9dff}input[type=range]{width:100%;accent-color:#8babff}.viz{border:1px solid #344665;border-radius:13px;padding:20px;background:#0e1a2f}.bars{display:flex;align-items:end;justify-content:center;gap:70px;height:165px;border-bottom:1px solid #50627c}.bar{width:100px;background:#668aff;border-radius:8px 8px 0 0;transition:height .2s;min-height:3px}.bar:nth-child(2){background:#45b6a4}.barlabels{display:flex;justify-content:center;gap:70px}.barlabels span{width:100px;text-align:center;font-size:12px;color:#b9c8df}footer{color:#8294ad;font-size:12px;padding:30px 0}@media(max-width:750px){.wrap{display:block}aside{position:static;max-height:none}aside button{display:inline-block;width:auto;font-size:12px}header{position:static}.panel{padding:17px}}

const chapters=[
{title:'Variational mechanics',field:'Classical mechanics',level:'Foundation',intro:'Derive Newtonian dynamics from the stationary-action principle, rather than memorizing equations of motion.',assumptions:'A differentiable Lagrangian L(q, q̇, t), fixed endpoint positions, and arbitrary smooth variations between endpoints.',steps:[['Define the action','\\displaystyle S[q]=\\int_{t_1}^{t_2}L(q,\\dot q,t)\\,dt','The physical path is stationary under infinitesimal changes of the trajectory.'],['Vary the trajectory','\\displaystyle \\delta S=\\int_{t_1}^{t_2}\\left(\\frac{\\partial L}{\\partial q}\\delta q+\\frac{\\partial L}{\\partial\\dot q}\\delta\\dot q\\right)dt','Because differentiation and variation commute, δq̇=d(δq)/dt.'],['Integrate by parts','\\displaystyle \\delta S=\\left[\\frac{\\partial L}{\\partial\\dot q}\\delta q\\right]_{t_1}^{t_2}+\\int_{t_1}^{t_2}\\left(\\frac{\\partial L}{\\partial q}-\\frac{d}{dt}\\frac{\\partial L}{\\partial\\dot q}\\right)\\delta q\\,dt','The boundary term vanishes because the endpoints are fixed.'],['Use arbitrary variations','\\displaystyle \\boxed{\\frac{d}{dt}\\frac{\\partial L}{\\partial\\dot q}-\\frac{\\partial L}{\\partial q}=0}','The integrand must vanish for every allowed variation. For L=mq̇²/2−V(q), this yields mq̈=−dV/dq.']],question:'Why does the boundary term disappear?',answers:['Energy is conserved','The endpoint variations vanish','The velocity is constant'],correct:1,explain:'The derivation fixes q(t₁) and q(t₂), so δq(t₁)=δq(t₂)=0.',challenge:'For L=½m q̇²−½kq², derive the oscillator equation and identify ω.'},
{title:'Maxwell to electromagnetic waves',field:'Electromagnetism',level:'Foundation',intro:'Show how propagating electromagnetic waves emerge from the source-free Maxwell equations.',assumptions:'Vacuum with ρ=0, J=0 and constant ε₀, μ₀.',steps:[['Start with curl equations','\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B,\\qquad\\nabla\\times\\mathbf B=\\mu_0\\epsilon_0\\partial_t\\mathbf E','A time-varying magnetic field induces an electric field and vice versa.'],['Take the curl','\\nabla\\times(\\nabla\\times\\mathbf E)=-\\mu_0\\epsilon_0\\partial_t^2\\mathbf E','Substitute Ampère–Maxwell law into the curl of Faraday’s law.'],['Apply the vector identity','\\nabla(\\nabla\\cdot\\mathbf E)-\\nabla^2\\mathbf E=-\\mu_0\\epsilon_0\\partial_t^2\\mathbf E','Gauss’s law gives ∇·E=0 in source-free vacuum.'],['Identify the wave equation','\\boxed{\\nabla^2\\mathbf E-\\frac{1}{c^2}\\partial_t^2\\mathbf E=0},\\qquad c=\\frac{1}{\\sqrt{\\mu_0\\epsilon_0}}','The same derivation applies to B. The propagation speed is fixed by vacuum constants.']],question:'Which assumption removes ∇(∇·E)?',answers:['The magnetic field is zero','There are no electric charges in vacuum','The electric field is static'],correct:1,explain:'Gauss’s law gives ∇·E=ρ/ε₀, so this term vanishes for ρ=0.',challenge:'Insert E=E₀ exp[i(k·r−ωt)] and derive ω=ck.'},
{title:'Canonical ensemble from a reservoir',field:'Statistical mechanics',level:'Intermediate',intro:'Understand why a microstate is weighted by e^(−βE), and why the partition function appears.',assumptions:'A small system exchanges energy with a much larger reservoir. The combined system is isolated and equally likely total microstates are assumed.',steps:[['Count compatible states','P_i\\propto\\Omega_R(E_{\\rm tot}-E_i)','For fixed system microstate i, only the reservoir multiplicity varies.'],['Use Boltzmann entropy','\\Omega_R(E_R)=\\exp[S_R(E_R)/k_B]','Multiplicity can be expressed through entropy.'],['Expand the reservoir entropy','S_R(E_{\\rm tot}-E_i)\\simeq S_R(E_{\\rm tot})-E_i/T','Use ∂S_R/∂E_R=1/T; the large reservoir temperature barely changes.'],['Normalize the probabilities','\\boxed{P_i=\\frac{e^{-\\beta E_i}}{Z}},\\quad\\boxed{Z=\\sum_i e^{-\\beta E_i}},\\quad\\beta=1/(k_BT)','The partition function is the normalization sum over microstates, including degeneracy.']],question:'Why is Z needed?',answers:['To force all states to have equal energy','To normalize probabilities','To fix the particle number'],correct:1,explain:'Z ensures ∑ᵢPᵢ=1. Equal energies are not required.',challenge:'For energies 0 and Δ, derive Z, the excited-state probability, and the mean energy.',sim:true},
{title:'Free energies and Legendre transforms',field:'Thermodynamics',level:'Intermediate',intro:'Understand why each ensemble has a different equilibrium potential.',assumptions:'Simple compressible one-component system with dU=T dS−P dV+μ dN.',steps:[['Start with the fundamental relation','dU=T\\,dS-P\\,dV+\\mu\\,dN','Internal energy has natural variables S, V and N.'],['Exchange entropy for temperature','F=U-TS,\\quad dF=-S\\,dT-P\\,dV+\\mu\\,dN','The Helmholtz potential is natural when T, V, N are controlled.'],['Exchange volume for pressure','G=U+PV-TS,\\quad dG=-S\\,dT+V\\,dP+\\mu\\,dN','The Gibbs potential is natural when T, P, N are controlled.'],['Exchange particle number for chemical potential','\\Phi_G=U-TS-\\mu N,\\quad d\\Phi_G=-S\\,dT-P\\,dV-N\\,d\\mu','The grand potential is natural when T, V, μ are controlled.']],question:'Which potential is minimized at fixed T,V,N?',answers:['Enthalpy H','Helmholtz F','Gibbs G'],correct:1,explain:'The canonical ensemble holds T, V and N fixed, making F its equilibrium potential.',challenge:'Derive dΦ_G explicitly and explain why −∂Φ_G/∂μ=N.'},
{title:'Time-independent perturbation theory',field:'Quantum mechanics',level:'Advanced',intro:'Derive the second-order energy shift from the Schrödinger eigenvalue equation.',assumptions:'Discrete nondegenerate unperturbed spectrum and a sufficiently small perturbation H=H₀+λV.',steps:[['Expand the eigenvalue problem','(H_0+\\lambda V)|n\\rangle=E_n|n\\rangle','Write |n⟩=|n⁽⁰⁾⟩+λ|n⁽¹⁾⟩+… and similarly for E.'],['First-order correction','E_n^{(1)}=\\langle n^{(0)}|V|n^{(0)}\\rangle','Project the order-λ equation onto the unperturbed state.'],['Correct the eigenstate','|n^{(1)}\\rangle=\\sum_{m\\ne n}|m^{(0)}\\rangle\\frac{\\langle m^{(0)}|V|n^{(0)}\\rangle}{E_n^{(0)}-E_m^{(0)}}','Choose intermediate normalization ⟨n⁽⁰⁾|n⟩=1.'],['Second-order energy','\\boxed{E_n^{(2)}=\\sum_{m\\ne n}\\frac{|\\langle m^{(0)}|V|n^{(0)}\\rangle|^2}{E_n^{(0)}-E_m^{(0)}}}','Small energy denominators signal breakdown of nondegenerate perturbation theory.']],question:'What happens near degeneracy?',answers:['The perturbation always vanishes','Use degenerate perturbation theory','The system becomes classical'],correct:1,explain:'Near-degenerate states must be treated together, usually by diagonalizing the perturbation within their subspace.',challenge:'For a two-level Hamiltonian with diagonal energies 0, Δ and off-diagonal coupling v, compare the exact lower eigenvalue with the second-order result −|v|²/Δ.'},
{title:'Grand canonical occupation',field:'Quantum statistics',level:'Advanced',intro:'Derive the Fermi–Dirac occupation of one spinless fermionic orbital from particle exchange.',assumptions:'One orbital of energy ε, occupancy n=0 or 1, reservoir at T and chemical potential μ.',steps:[['Enumerate allowed occupations','n\\in\\{0,1\\},\\qquad E_n=n\\epsilon','The Pauli principle permits at most one spinless fermion in the orbital.'],['Construct the grand partition function','\\Xi=\\sum_{n=0}^1e^{-\\beta(n\\epsilon-\\mu n)}=1+e^{-\\beta(\\epsilon-\\mu)}','The chemical potential enters as −μN.'],['Compute the mean occupation','\\langle n\\rangle=\\frac{0+e^{-\\beta(\\epsilon-\\mu)}}{\\Xi}','Only the occupied state contributes to the numerator.'],['Simplify','\\boxed{f(\\epsilon)=\\frac{1}{e^{\\beta(\\epsilon-\\mu)}+1}}','At ε=μ the occupation is 1/2, independent of temperature.']],question:'What is the occupation at ε=μ?',answers:['0','1/2','1'],correct:1,explain:'The two allowed occupations have equal grand-canonical weight.',challenge:'Repeat the counting for a bosonic mode with n=0,1,2,… and derive Bose–Einstein occupation.'}
];
let index=0;let state={};try{state=JSON.parse(localStorage.getItem('atlas-deep-study')||'{}')}catch(e){};function save(){try{localStorage.setItem('atlas-deep-study',JSON.stringify(state))}catch(e){}}function progress(){let n=chapters.filter((_,i)=>state[i]?.done).length;document.getElementById('progressText').textContent=`${n} / ${chapters.length} chapters mastered`;document.getElementById('progressBar').style.width=(100*n/chapters.length)+'%'}function menu(){document.getElementById('chapters').innerHTML=chapters.map((c,i)=>`<button class="${i===index?'active':''}" onclick="openChapter(${i})">${state[i]?.done?'✓ ':''}${i+1}. ${c.title}</button>`).join('');progress()}function typeset(){if(window.MathJax?.typesetPromise)MathJax.typesetPromise().catch(()=>{})}function openChapter(i){index=i;render();window.scrollTo(0,0)}function check(n){let c=chapters[index],el=document.getElementById('feedback'),good=n===c.correct;state[index]={...(state[index]||{}),attempts:(state[index]?.attempts||0)+1,correct:good||!!state[index]?.correct};save();el.className='feedback '+(good?'good':'bad');el.textContent=(good?'Correct. ':'Not quite. ')+c.explain;el.classList.remove('hidden');document.querySelectorAll('.options button').forEach((b,j)=>{b.disabled=true;if(j===c.correct)b.classList.add('good');else if(j===n)b.classList.add('bad')});menu()}function master(){state[index]={...(state[index]||{}),done:!state[index]?.done};save();render()}function toggle(id){document.getElementById(id).classList.toggle('hidden');typeset()}function render(){let c=chapters[index];document.getElementById('content').innerHTML=`<div class="eyebrow">${c.field} · ${c.level} · Chapter ${index+1} of ${chapters.length}</div><h1>${c.title}</h1><p>${c.intro}</p><div class="toolbar"><span class="pill">Detailed derivation</span><span class="pill">Active recall</span><span class="pill">Worked challenge</span></div><div class="panel"><h2 style="margin-top:0">Physical assumptions</h2><p>${c.assumptions}</p></div><h2>Step-by-step derivation</h2>${c.steps.map((s,i)=>`<section class="step"><h3>0${i+1} — ${s[0]}</h3><div class="math">\\[${s[1]}\\]</div><p>${s[2]}</p></section>`).join('')}${c.sim?`<section class="panel"><h2 style="margin-top:0">Interactive two-level thermal system</h2><p>Adjust the dimensionless temperature \(k_BT/\\Delta\) to see Boltzmann probabilities.</p><div class="viz"><label for="temperature">Thermal energy: <strong id="tempLabel">1.00</strong> × Δ</label><input id="temperature" type="range" min="0.1" max="5" step="0.05" value="1" oninput="updateSim()"><div class="bars"><div class="bar" id="groundBar"></div><div class="bar" id="excitedBar"></div></div><div class="barlabels"><span id="groundText"></span><span id="excitedText"></span></div></div></section>`:''}<section class="panel"><h2 style="margin-top:0">Active recall · Concept check</h2><p>${c.question}</p><div class="options">${c.answers.map((a,i)=>`<button onclick="check(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div id="feedback" class="feedback hidden"></div></section><section class="panel"><h2 style="margin-top:0">Derivation challenge</h2><p>${c.challenge}</p><button onclick="toggle('hint')">Show / hide study strategy</button><div id="hint" class="hidden"><p>Begin from the assumptions and reproduce the steps without looking. Then check units, limits, and the physical interpretation. Explain the result aloud before marking the chapter complete.</p></div></section><div class="toolbar"><button class="primary" onclick="master()">${state[index]?.done?'✓ Mastered — undo':'Mark chapter mastered'}</button><button onclick="openChapter(${(index+1)%chapters.length})">Next chapter →</button><a href="index.html" style="align-self:center">Full curriculum</a></div><footer>Physics Atlas · This is a growing collection of detailed chapters, not yet an exhaustive graduate textbook. Equation rendering uses MathJax via CDN.</footer>`;menu();typeset();if(c.sim)updateSim()}function updateSim(){let x=Number(document.getElementById('temperature').value),p=1/(1+Math.exp(1/x));document.getElementById('tempLabel').textContent=x.toFixed(2);document.getElementById('groundBar').style.height=(145*(1-p))+'px';document.getElementById('excitedBar').style.height=(145*p)+'px';document.getElementById('groundText').textContent='Ground '+((1-p)*100).toFixed(1)+'%';document.getElementById('excitedText').textContent='Excited '+(p*100).toFixed(1)+'%'}render();</script></body></html>
