<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Atlas — Theoretical Physics Academy</title><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" defer></script><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e8edf7;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#10182b;border-right:1px solid #26334c;padding:25px 16px;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-size:23px;font-weight:800;letter-spacing:-1px;margin:0 8px 5px}.sub{color:#92a3bd;font-size:12px;margin:0 8px 30px}.nav{width:100%;border:0;background:transparent;color:#aebcd3;text-align:left;padding:13px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:#233351;color:#fff}.main{padding:34px clamp(18px,4vw,64px);max-width:1500px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:#8baeff;font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:700}h1{font-size:clamp(28px,4vw,44px);margin:8px 0 12px;letter-spacing:-1.3px}p{line-height:1.7;color:#adbbd0}.hero{padding:35px;border:1px solid #31436b;border-radius:22px;background:radial-gradient(ellipse at 90% 20%,#273d75 0%,#172442 38%,#121b30 80%);margin:22px 0}.hero p{max-width:690px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:23px}.stat{background:#ffffff0b;border:1px solid #ffffff16;border-radius:12px;padding:13px 20px}.stat strong{display:block;font-size:22px}.stat small{color:#aab8d0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,select{background:#141f34;border:1px solid #34435e;color:#f0f4ff;border-radius:10px;padding:12px;min-width:150px}input{flex:1;min-width:220px}.btn{border:1px solid #435779;background:#223455;color:#f2f5ff;padding:11px 15px;border-radius:10px}.btn.primary{background:#648bff;color:#08142e;border:0;font-weight:750}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#151f33;border:1px solid #2b3a53;border-radius:16px;padding:22px;transition:.2s}.card:hover{border-color:#7295ef;transform:translateY(-2px)}.tag{font-size:11px;color:#a5bbff;letter-spacing:1px;text-transform:uppercase}.card h3{margin:12px 0 8px;font-size:19px}.card p{font-size:13px;min-height:62px}.progress{height:6px;background:#293851;border-radius:10px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:#77a1ff}.muted{color:#94a4bb;font-size:13px}.lesson{max-width:920px}.panel{background:#151f33;border:1px solid #30405c;padding:25px;border-radius:16px;margin:20px 0}.panel h2{margin-top:0}.equation{background:#0c1629;border:1px solid #34466b;border-radius:10px;padding:20px;overflow-x:auto;text-align:center;margin:18px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #2a3950}.item:last-child{border:0}.item button{white-space:nowrap}.crumb{color:#8e9fbb;font-size:13px;margin:15px 0}.answer{padding:14px;background:#112b2c;border:1px solid #286961;border-radius:10px;margin-top:12px}.hidden{display:none}.footer{padding:30px 0;color:#8090aa;font-size:12px}.pill{border:1px solid #4a5f86;border-radius:99px;padding:7px 12px;font-size:12px;color:#b9cafa}.quizopt{display:block;width:100%;text-align:left;background:#17243b;color:#e7edfb;border:1px solid #334762;padding:12px;border-radius:9px;margin:8px 0}.quizopt.correct{border-color:#42c9a0;background:#163c38}.quizopt.wrong{border-color:#e68181;background:#3d232c}.meter{height:10px;background:#27354b;border-radius:10px;overflow:hidden}.meter>div{background:#79a4ff;height:100%}@media(max-width:750px){.app{display:block}.side{position:static;height:auto;padding:15px}.side .nav{display:inline-block;width:auto;padding:9px}.sub{margin-bottom:12px}.main{padding:18px}.hero{padding:24px}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="logo">◈ Physics Atlas</div><div class="sub">THEORETICAL PHYSICS ACADEMY</div><a href="textbook.html" style="display:block;margin:12px 8px 20px;padding:13px;border-radius:10px;background:#28436e;color:#fff;text-decoration:none;font-weight:700">📖 Full textbook chapter →</a><button class="nav active" data-view="home">⌂ &nbsp; Dashboard</button><button class="nav" data-view="curriculum">▦ &nbsp; Full curriculum</button><button class="nav" data-view="path">◇ &nbsp; Learning pathways</button><a class="nav" href="deep-study.html" style="display:block;text-decoration:none">▤ &nbsp; Deep study textbook</a><a class="nav" href="game.html" style="display:block;text-decoration:none">⚡ &nbsp; Physics Quest</a><button class="nav" data-view="practice">✎ &nbsp; Practice lab</button><button class="nav" data-view="formulas">∑ &nbsp; Formula library</button><button class="nav" data-view="progress">◷ &nbsp; My progress</button><div class="footer">Progress saved in this browser.<br>Deep Study adds full derivations and mastery checks.<br>Math rendering requires internet access.</div></aside><main class="main" id="main"></main></div><script>
const topics=[
['Mathematical Foundations','Foundation','Calculus, linear algebra, differential equations, Fourier analysis, complex analysis, probability and geometry.',[['Vector spaces and eigenvalues','Diagonalization, Hermitian operators and spectral decomposition','A|v\\rangle=\\lambda|v\\rangle','For a Hermitian matrix, eigenvalues are real.','Why must an eigenvalue of a Hermitian operator be real?','Because \\langle v|A|v\\rangle equals its complex conjugate and also equals \\lambda\\langle v|v\\rangle.'],['Variational calculus','Functional derivatives and Euler–Lagrange equations','\\frac{\\partial L}{\\partial q}-\\frac{d}{dt}\\frac{\\partial L}{\\partial\\dot q}=0','Vary the action with fixed endpoints and integrate the velocity variation by parts.','Derive the equation for a free particle.','For L=m\\dot q^2/2, d(m\\dot q)/dt=0.'],['Fourier transforms','Frequency-space methods and delta distributions','\\tilde f(k)=\\int_{-\\infty}^{\\infty}f(x)e^{-ikx}dx','Differentiation in position space becomes multiplication by ik in Fourier space.','What is the transform of df/dx?','ik times the transform of f, assuming boundary terms vanish.']]],
['Classical Mechanics','Foundation','Newtonian dynamics, conservation laws, Lagrangians, Hamiltonians, canonical transformations and chaos.',[['Lagrangian mechanics','Derive motion from stationary action','S[q]=\\int_{t_1}^{t_2}L(q,\\dot q,t)dt','Vary q by an arbitrary function vanishing at the endpoints. Integration by parts yields Euler–Lagrange equations.','What is the oscillator equation for L=m qdot²/2−kq²/2?','m q double-dot + kq = 0.'],['Hamiltonian mechanics','Phase space and canonical equations','\\dot q_i=\\frac{\\partial H}{\\partial p_i},\\quad\\dot p_i=-\\frac{\\partial H}{\\partial q_i}','Define canonical momentum p=∂L/∂qdot and Legendre-transform H=pqdot−L.','What is H for a free particle?','p²/(2m).'],['Noether theorem','Continuous symmetries and conserved charges','\\frac{dQ}{dt}=0','Invariance of the action under a continuous transformation implies a conserved Noether charge.','Which symmetry gives energy conservation?','Time translation invariance.']]],
['Electromagnetism','Foundation','Electrostatics, magnetostatics, Maxwell equations, potentials, waves and gauge invariance.',[['Maxwell equations','Fields and sources in differential form','\\nabla\\cdot\\mathbf E=\\frac{\\rho}{\\epsilon_0},\\quad\\nabla\\times\\mathbf B=\\mu_0\\mathbf J+\\mu_0\\epsilon_0\\partial_t\\mathbf E','Combine Faraday’s law and Ampère–Maxwell law in vacuum to obtain a wave equation.','What is the vacuum wave speed?','1/sqrt(μ₀ε₀).'],['Electromagnetic waves','Wave equations and polarization','\\nabla^2\\mathbf E-\\frac{1}{c^2}\\partial_t^2\\mathbf E=0','Take the curl of Faraday’s law and use the curl-curl identity with Maxwell’s equations.','Are vacuum plane waves transverse?','Yes, k·E = k·B = 0.'],['Gauge symmetry','Potentials and gauge transformations','\\mathbf A\\to\\mathbf A+\\nabla\\chi,\\quad\\phi\\to\\phi-\\partial_t\\chi','The electric and magnetic fields are invariant under these transformations.','Which observable changes under a gauge transformation?','Neither E nor B.']]],
['Thermodynamics','Foundation','Thermodynamic laws, entropy, temperature, work, equilibrium and thermodynamic potentials.',[['Fundamental relation','Energy, entropy, pressure and chemical potential','dU=T\\,dS-P\\,dV+\\mu\\,dN','The coefficients of differentials define the conjugate intensive variables.','What is ∂U/∂S at fixed V,N?','Temperature T.'],['Free energies','Legendre transforms and natural variables','F=U-TS,\\quad G=U+PV-TS','Transform entropy into temperature as a controlled variable using F=U−TS.','What potential is minimized at fixed T,V,N?','Helmholtz free energy F.'],['Heat engines','Carnot cycles and efficiency bounds','\\eta_{Carnot}=1-\\frac{T_c}{T_h}','The second law bounds the efficiency of any engine between two thermal reservoirs.','Can a reversible engine exceed Carnot efficiency?','No.']]],
['Statistical Mechanics','Intermediate','Microcanonical, canonical and grand canonical ensembles; partition functions, fluctuations and quantum statistics.',[['Microcanonical ensemble','Equal a priori probabilities for isolated systems','P_i=\\frac{1}{\\Omega},\\quad S=k_B\\ln\\Omega','An isolated system at fixed E,V,N assigns equal probabilities to accessible microstates.','Which quantity counts accessible microstates?','Multiplicity Ω.'],['Canonical partition function','Derive the Boltzmann distribution from a reservoir','Z=\\sum_i e^{-\\beta E_i},\\quad P_i=\\frac{e^{-\\beta E_i}}{Z}','For a small system in contact with a large reservoir, P_i is proportional to Ω_R(Etotal−E_i). Expanding reservoir entropy gives exp(−E_i/kBT); normalization defines Z.','Why does Z appear in P_i?','It normalizes the probabilities to sum to one.'],['Grand canonical ensemble','Particle exchange and chemical potential','\\Xi=\\sum_{N,i}e^{-\\beta(E_{i,N}-\\mu N)}','Allow both energy and particle number to fluctuate while fixing T,V,μ.','What is the grand potential?','−kBT ln Ξ.'],['Quantum statistics','Bose–Einstein and Fermi–Dirac occupations','\\bar n_{F}=\\frac{1}{e^{\\beta(\\epsilon-\\mu)}+1}','Occupation counting differs for fermions and bosons due to exchange symmetry.','What is the fermion occupation at ε=μ?','One half.']]],
['Quantum Mechanics','Intermediate','Hilbert spaces, operators, Schrödinger dynamics, angular momentum, perturbation theory and scattering.',[['Schrödinger equation','Unitary dynamics and the Hamiltonian','i\\hbar\\partial_t|\\psi\\rangle=H|\\psi\\rangle','A self-adjoint Hamiltonian generates unitary time evolution.','What is the propagator for time-independent H?','exp(−iHt/ℏ).'],['Angular momentum','Commutation relations and spin','[J_x,J_y]=i\\hbar J_z','Angular momentum operators form the su(2) algebra.','What are the spin-1/2 z eigenvalues?','±ℏ/2.'],['Perturbation theory','Energy shifts and transition amplitudes','E_n^{(2)}=\\sum_{m\\ne n}\\frac{|\\langle m|V|n\\rangle|^2}{E_n^{(0)}-E_m^{(0)}}','Expand eigenstates and eigenvalues order by order in a small perturbation.','What happens near degeneracy?','Use degenerate perturbation theory.'],['Density matrices','Mixed states and partial trace','\\rho=\\sum_i p_i|\\psi_i\\rangle\\langle\\psi_i|','Density operators represent both pure and statistical mixed states.','What is Tr ρ?','One.']]],
['Special Relativity','Intermediate','Lorentz transformations, spacetime intervals, four-vectors and relativistic dynamics.',[['Lorentz invariance','Minkowski spacetime and boosts','s^2=c^2t^2-x^2-y^2-z^2','Lorentz transformations preserve the spacetime interval.','What stays invariant under a Lorentz boost?','The Minkowski interval.'],['Relativistic energy','Four-momentum and mass shell','E^2=p^2c^2+m^2c^4','The four-momentum norm is invariant.','What is the rest energy?','mc².']]],
['General Relativity','Advanced','Differential geometry, curvature, Einstein equations, black holes and cosmology.',[['Geodesics','Motion in curved spacetime','\\frac{d^2x^\\mu}{d\\tau^2}+\\Gamma^\\mu_{\\alpha\\beta}\\frac{dx^\\alpha}{d\\tau}\\frac{dx^\\beta}{d\\tau}=0','Extremizing proper time yields the geodesic equation.','What does the connection describe?','How coordinate bases vary and how vectors are parallel transported.'],['Einstein field equations','Geometry coupled to stress-energy','G_{\\mu\\nu}+\\Lambda g_{\\mu\\nu}=\\frac{8\\pi G}{c^4}T_{\\mu\\nu}','The Einstein tensor encodes curvature; stress-energy supplies the source.','What is the vacuum equation with Λ=0?','Rμν=0.']]],
['Quantum Field Theory','Advanced','Canonical quantization, path integrals, propagators, gauge theory and renormalization.',[['Path integrals','Sum over histories and stationary phase','\\mathcal Z=\\int\\mathcal D\\phi\\,e^{iS[\\phi]/\\hbar}','Classical equations emerge from stationary phase in the ℏ→0 limit.','What controls quantum phase?','Action divided by ℏ.'],['Scalar field quantization','Field operators and excitations','\\mathcal L=\\frac12\\partial_\\mu\\phi\\partial^\\mu\\phi-\\frac12m^2\\phi^2','Expand the field in creation and annihilation modes.','What are excitations of a quantized field?','Particles or quasiparticles.'],['Renormalization','Scale dependence and effective theories','\\beta(g)=\\mu\\frac{dg}{d\\mu}','Couplings depend on the energy scale at which they are defined.','What is a beta function?','The rate of change of a coupling with renormalization scale.']]],
['Condensed Matter Physics','Advanced','Band theory, many-body systems, superconductivity, topological phases and quantum transport.',[['Bloch theorem','Periodic potentials and electronic bands','\\psi_{n\\mathbf k}(\\mathbf r)=e^{i\\mathbf k\\cdot\\mathbf r}u_{n\\mathbf k}(\\mathbf r)','Translation symmetry labels eigenstates by crystal momentum.','What is periodic in the Bloch function?','u_nk(r) has lattice periodicity.'],['Second quantization','Fock space and many-body Hamiltonians','H=\\sum_{ij}t_{ij}c_i^\\dagger c_j+\\frac12\\sum_{ijkl}V_{ijkl}c_i^\\dagger c_j^\\dagger c_l c_k','Creation and annihilation operators encode variable particle occupations.','What algebra do fermionic operators obey?','Anticommutation relations.'],['Superconductivity','Pairing, Bogoliubov theory and Josephson effects','E_k=\\sqrt{\\xi_k^2+|\\Delta|^2}','Mean-field pairing mixes electron and hole excitations.','What does Δ represent?','The superconducting pairing gap/order parameter.']]],
['Quantum Information','Advanced','Qubits, entanglement, open quantum systems, quantum gates and error correction.',[['Single-qubit gates','Bloch sphere and SU(2) rotations','R_\\mathbf n(\\theta)=e^{-i\\theta\\mathbf n\\cdot\\boldsymbol\\sigma/2}','A qubit undergoes rotations generated by Pauli matrices.','What is the state space of a pure qubit?','The Bloch sphere surface.'],['Open quantum systems','Lindblad dynamics and decoherence','\\dot\\rho=-\\frac{i}{\\hbar}[H,\\rho]+\\sum_j\\mathcal D[L_j]\\rho','Lindblad dissipators describe Markovian environmental coupling.','What is T1?','Energy relaxation time.'],['Quantum error correction','Stabilizers, logical operators and thresholds','S_i|\\psi_L\\rangle=|\\psi_L\\rangle','Redundant encoding allows errors to be diagnosed without measuring logical information.','What is a stabilizer?','An operator whose +1 eigenspace defines the code space.']]],
['Quantum Devices & Spin Qubits','Research','Semiconductor heterostructures, quantum dots, spin–orbit coupling, exchange, EDSR and circuit QED.',[['Quantum-dot confinement','Effective mass, electrostatics and bound states','H=\\frac{(\\mathbf p+e\\mathbf A)^2}{2m^*}+V(\\mathbf r)','Gate-defined confinement sets orbital states and tunnel couplings.','What primarily controls interdot tunnel coupling?','The interdot barrier potential and orbital overlap.'],['Spin–orbit coupling','Rashba, Dresselhaus and effective g tensors','H_{SO}=\\alpha(\\sigma_x k_y-\\sigma_y k_x)','Spin–orbit coupling links electric motion to spin dynamics.','How can an AC electric field rotate a spin?','Via spin–orbit-induced spin-electric coupling, including g-tensor modulation.'],['Exchange coupling','Two-spin interactions and singlet-triplet splitting','H_{ex}=J\\mathbf S_1\\cdot\\mathbf S_2','Virtual tunneling and Coulomb repulsion generate effective spin exchange.','What is J in the simplest Hubbard limit?','Approximately 4t²/U at zero detuning and large U.'],['Circuit QED','Qubit–resonator coupling and dispersive shifts','H/\\hbar=\\omega_r a^\\dagger a+\\frac{\\omega_q}{2}\\sigma_z+g(a^\\dagger\\sigma_-+a\\sigma_+)','In the dispersive regime, virtual exchange shifts the resonator depending on the qubit state.','What defines the dispersive regime?','|ωq−ωr| much larger than g.']]],
['Advanced Mathematical Physics','Research','Group theory, differential geometry, Green functions, functional analysis and topology.',[['Lie groups','Continuous symmetry and representations','[T_a,T_b]=if_{ab}^{\\phantom{ab}c}T_c','Lie algebra generators encode infinitesimal symmetry transformations.','What are structure constants?','Coefficients defining the commutator of generators.'],['Green functions','Inverse operators and response theory','L G(x,x^\\prime)=\\delta(x-x^\\prime)','Green functions solve linear differential equations with specified boundary conditions.','Why do boundary conditions matter?','They select the physically relevant inverse of the operator.'],['Topology and Berry phase','Geometric phases and Chern invariants','\\gamma= i\\oint\\langle u|\\nabla_\\mathbf k u\\rangle\\cdot d\\mathbf k','Adiabatic evolution can accumulate geometric phase beyond dynamical phase.','What is the Berry connection?','i⟨u|∇k u⟩.']]]
];
const key='physics-atlas-completed-v1';let done=new Set(JSON.parse(localStorage.getItem(key)||'[]'));let view='home',selected=[4,1],search='',level='All';const total=topics.reduce((n,t)=>n+t[3].length,0);const id=(a,b)=>a+':'+b;function save(){localStorage.setItem(key,JSON.stringify([...done]))}function tex(s){return '\\['+s+'\\]'}function typeset(){if(window.MathJax?.typesetPromise)MathJax.typesetPromise().catch(()=>{})}function navigate(v){view=v;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render();scrollTo(0,0)}function card(t,i){let count=t[3].filter((_,j)=>done.has(id(i,j))).length;return `<article class="card"><span class="tag">${t[1]} · ${t[3].length} lessons</span><h3>${t[0]}</h3><p>${t[2]}</p><div class="progress"><span style="width:${100*count/t[3].length}%"></span></div><div class="muted">${count}/${t[3].length} complete</div><button class="btn" style="margin-top:15px" onclick="openTopic(${i})">Explore course →</button></article>`}function filtered(){return topics.map((t,i)=>({t,i})).filter(({t})=>(level==='All'||t[1]===level)&&[t[0],t[2],...t[3].map(x=>x[0])].join(' ').toLowerCase().includes(search.toLowerCase()))}function render(){let m=document.getElementById('main');let completed=done.size;let pct=Math.round(completed/total*100);if(view==='home'){m.innerHTML=`<div class="top"><span class="eyebrow">YOUR PHYSICS LEARNING SPACE</span><span class="pill">${completed} lessons completed</span></div><section class="hero"><span class="eyebrow">FROM FIRST PRINCIPLES TO RESEARCH</span><h1>Understand the universe.<br>One derivation at a time.</h1><p>A structured theoretical physics review with curated topics, worked conceptual derivations, equations, self-tests, and persistent progress. Start from fundamentals or jump to graduate and research topics.</p><div class="stats"><div class="stat"><strong>${topics.length}</strong><small>Core disciplines</small></div><div class="stat"><strong>${total}</strong><small>Starter lessons</small></div><div class="stat"><strong>${pct}%</strong><small>Completed</small></div></div><div style="margin-top:23px"><button class="btn primary" onclick="navigate('curriculum')">Browse curriculum →</button> <button class="btn" onclick="openLesson(4,1)">Resume statistical mechanics</button></div></section><h2>Explore the disciplines</h2><div class="cards">${topics.slice(0,6).map(card).join('')}</div>`}else if(view==='curriculum'){m.innerHTML=`<span class="eyebrow">THE COMPLETE MAP</span><h1>Physics curriculum</h1><p>Browse by level, search topics, and open lessons. Each course includes key results and review questions.</p><div class="toolbar"><input id="search" placeholder="Search courses and lessons..." value="${search.replaceAll('"','&quot;')}"><select id="level"><option>All</option><option>Foundation</option><option>Intermediate</option><option>Advanced</option><option>Research</option></select></div><div class="cards" id="cards">${filtered().map(({t,i})=>card(t,i)).join('')}</div>`;document.getElementById('level').value=level;document.getElementById('search').oninput=e=>{search=e.target.value;document.getElementById('cards').innerHTML=filtered().map(({t,i})=>card(t,i)).join('')||'<p>No matching topics.</p>'};document.getElementById('level').onchange=e=>{level=e.target.value;document.getElementById('cards').innerHTML=filtered().map(({t,i})=>card(t,i)).join('')}}else if(view==='topic'){let [a]=selected,t=topics[a];m.innerHTML=`<div class="crumb"><a href="#" onclick="navigate('curriculum');return false">Curriculum</a> / ${t[0]}</div><span class="eyebrow">${t[1]} · ${t[3].length} LESSONS</span><h1>${t[0]}</h1><p>${t[2]}</p><div class="panel"><h2>Lessons</h2>${t[3].map((l,b)=>`<div class="item"><div><strong>${b+1}. ${l[0]}</strong><div class="muted">${l[1]}</div></div><button class="btn" onclick="openLesson(${a},${b})">${done.has(id(a,b))?'✓ Review':'Study →'}</button></div>`).join('')}</div>`}else if(view==='lesson'){let [a,b]=selected,l=topics[a][3][b];m.innerHTML=`<div class="lesson"><div class="crumb"><a href="#" onclick="openTopic(${a});return false">${topics[a][0]}</a> / ${l[0]}</div><span class="eyebrow">LESSON ${b+1} OF ${topics[a][3].length}</span><h1>${l[0]}</h1><p>${l[1]}</p><div class="panel"><h2>Core equation</h2><div class="equation">${tex(l[2])}</div><h2>Derivation & physical meaning</h2><p>${l[3]}</p><p class="muted">This is a concise review note. Use a full textbook treatment for rigorous assumptions, proofs, and extended worked examples.</p></div><div class="panel"><h2>Check your understanding</h2><p>${l[4]}</p><button class="btn" onclick="document.getElementById('reveal').classList.toggle('hidden')">Show / hide explanation</button><div id="reveal" class="answer hidden">${l[5]}</div></div><button class="btn primary" onclick="toggleDone(${a},${b})">${done.has(id(a,b))?'✓ Completed — undo':'Mark lesson complete ✓'}</button> <button class="btn" onclick="nextLesson(${a},${b})">Next lesson →</button></div>`}else if(view==='path'){let groups=[['Foundations',[0,1,2,3]],['Core theoretical physics',[4,5,6]],['Graduate theory',[7,8,9,12]],['Quantum technology research',[10,11]]];m.innerHTML=`<span class="eyebrow">GUIDED LEARNING</span><h1>Learning pathways</h1><p>Suggested progression from mathematical foundations to advanced theory. Courses can also be studied independently.</p>${groups.map(([name,indices],i)=>`<div class="panel"><span class="tag">STAGE ${i+1}</span><h2>${name}</h2>${indices.map(j=>`<div class="item"><strong>${topics[j][0]}</strong><button class="btn" onclick="openTopic(${j})">Open →</button></div>`).join('')}</div>`).join('')}` }else if(view==='practice'){let q=topics.flatMap((t,a)=>t[3].map((l,b)=>({a,b,l})));let idx=Math.floor(Math.random()*q.length),o=q[idx];window.practice=q;m.innerHTML=`<span class="eyebrow">ACTIVE RECALL</span><h1>Practice lab</h1><p>Test yourself on questions across all physics disciplines. Reveal the model answer, then open the lesson to review.</p><div class="panel" id="practicebox"></div>`;window.nextQuestion=()=>{let o=q[Math.floor(Math.random()*q.length)];document.getElementById('practicebox').innerHTML=`<span class="tag">${topics[o.a][0]}</span><h2>${o.l[4]}</h2><button class="btn" onclick="document.getElementById('practiceanswer').classList.toggle('hidden')">Reveal answer</button><div id="practiceanswer" class="answer hidden">${o.l[5]}</div><div style="margin-top:20px"><button class="btn primary" onclick="nextQuestion()">Another question ↻</button> <button class="btn" onclick="openLesson(${o.a},${o.b})">Study lesson →</button></div>`};nextQuestion()}else if(view==='formulas'){m.innerHTML=`<span class="eyebrow">QUICK REFERENCE</span><h1>Formula library</h1><p>Essential equations organized by discipline. Open a course to explore their physical meaning.</p>${topics.map((t,a)=>`<div class="panel"><h2>${t[0]}</h2>${t[3].map((l,b)=>`<div class="item"><div style="max-width:100%;overflow:auto"><strong>${l[0]}</strong><div>${tex(l[2])}</div></div><button class="btn" onclick="openLesson(${a},${b})">Review</button></div>`).join('')}</div>`).join('')}` }else if(view==='progress'){m.innerHTML=`<span class="eyebrow">YOUR LEARNING RECORD</span><h1>Study progress</h1><p>${done.size} of ${total} lessons marked complete (${pct}%). Your progress is stored locally on this device.</p><div class="meter"><div style="width:${pct}%"></div></div><div class="panel">${topics.map((t,a)=>{let c=t[3].filter((_,b)=>done.has(id(a,b))).length;return `<div class="item"><div><strong>${t[0]}</strong><div class="muted">${c}/${t[3].length} lessons complete</div></div><button class="btn" onclick="openTopic(${a})">Review →</button></div>`}).join('')}</div><button class="btn" onclick="exportProgress()">Export progress JSON</button> <button class="btn" onclick="if(confirm('Clear all completed lessons?')){done.clear();save();render()}">Reset progress</button>`}typeset()}
function openTopic(a){selected=[a,0];view='topic';render();scrollTo(0,0)}function openLesson(a,b){selected=[a,b];view='lesson';render();scrollTo(0,0)}function nextLesson(a,b){if(b+1<topics[a][3].length)openLesson(a,b+1);else if(a+1<topics.length)openTopic(a+1);else navigate('progress')}function toggleDone(a,b){let k=id(a,b);let was=done.has(k);was?done.delete(k):done.add(k);save();if(!was){let g=JSON.parse(localStorage.getItem('physics-atlas-game-v1')||'{}');g.lessonRewards=g.lessonRewards||[];if(!g.lessonRewards.includes(k)){g.lessonRewards.push(k);g.xp=(g.xp||0)+25;localStorage.setItem('physics-atlas-game-v1',JSON.stringify(g))}}render()}function exportProgress(){let blob=new Blob([JSON.stringify({completed:[...done],exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='physics-atlas-progress.json';a.click();URL.revokeObjectURL(url)}document.querySelectorAll('.nav').forEach(x=>x.addEventListener('click',()=>navigate(x.dataset.view)));render();</script></body></html>
